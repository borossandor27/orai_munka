<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Táblázatok</title>
</head>
<body>
    <header>
        <h1>Táblázatok</h1>
    </header>
    <main>
        <section>
            <h2>Egyszerű táblázat</h2>
            <table border="1">
                <caption>Egyszerű táblázat</caption>
        </section>

        <section>
            <h2>Összetett táblázat</h2>
            <table border="1">
                <caption>Összetett táblázat</caption>
                <thead>
                    <tr>
                        <th rowspan="2">Név</th>
                        <th colspan="2">Értékek</th>
                    </tr>
                    <tr>
                        <th>Érték 1</th>
                        <th>Érték 2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Elem 1</td>
                        <td>10</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>Elem 2</td>
                        <td>30</td>
                        <td>40</td>
                    </tr>
                </tbody>
</body>
</html>
